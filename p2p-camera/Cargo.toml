[workspace]
resolver = "2"
members = [
    "proto",
    "mobile-core",
    "device-cam",
    "relay-server",
    "cam-test",
]

[workspace.dependencies]
# libp2p 内部 crate（path 指向父 workspace 源码）
libp2p = { version = "0.57.0", path = "../libp2p" }
libp2p-stream = { version = "0.5.0-alpha", path = "../protocols/stream" }
libp2p-swarm = { version = "0.48.0", path = "../swarm" }

# 外部依赖（版本与父 workspace 保持一致）
bytes = "1.11.1"
futures = "0.3.30"
tokio = { version = "1.52", default-features = false }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# 用于 build android 时跳过 device-cam 和 relay-server:
# cargo ndk -t aarch64-linux-android -p 26 -- build --release -p mobile-core
