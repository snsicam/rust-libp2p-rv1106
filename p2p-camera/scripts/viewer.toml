# 设备列表: 每个元素可以是长 PeerId 或短序列号 serial (如树莓派 /proc/cpuinfo 的
# Serial: e33700a6620dfddc)。viewer 自动判定——能 parse 成 PeerId 就直连，否则当
# serial 经 relay 注册表解析出真实 PeerId 再连接。
# (旧配置中的 `cameras` 字段仍可兼容，会被自动合并进来)
