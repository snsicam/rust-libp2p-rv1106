# P2P-Camera DeviceCam 配置文件
# 修改后重启 device-cam 生效
# 优先级: 命令行参数 > 配置文件 > 默认值

# ============ 网络连接 ============

# Relay Server 地址列表 (支持多个 Relay，并发拨号)
# 格式: /ip4/<ip>/tcp/<port>/p2p/<PeerId> 或 /ip4/<ip>/udp/<port>/quic-v1/p2p/<PeerId>
relays = ["/ip4/101.35.90.171/udp/4001/quic-v1/p2p/12D3KooWDGUejVsts1G4tGyf8ukkr73eWxCr1EUfCQxgcbSDUie1", 
"/ip4/134.175.248.113/udp/4001/quic-v1/p2p/12D3KooWMZNFG6htyb5gBrChtgag81YE5ySmXLoFiYhaUnQaTopr"]


# mDNS 局域网发现 (默认开启，同局域网 viewer 优先直连)
enable_mdns = true

# 是否启用 DCUtR 直连打洞。
# 4G/CGNAT 等入站 UDP 被屏蔽的网络下打洞必然失败，且其握手会挤占中继视频流
# 写入带宽，导致 SLOW write / 帧丢弃 / 卡顿。viewer 在 4G 时务必设为 false，仅走中继。
# 方案 B 实测失败（cam 在 4G/CGNAT 对称 NAT，DCUtR 打不通），回退方案 A 强制 main 流，
# 故此处保持 false，避免打洞握手挤占中继带宽。
enable_dcutr = false

# 运行模式 (listen: 等待 viewer 连接)
mode = "listen"

# 身份密钥文件 (持久化 PeerId，首次运行自动生成)
key_file = "device-cam.key"

# sensor 原生输出帧率 (摄像头模组实际产出率)。
# 这是 VENC 的实际输入帧率, 编码器据此按各码流目标帧率(dst_frame_rate)丢帧;
# 必须填真实 sensor 率(通常 30), 不能填某码流的配置 fps, 否则帧率控制失效、实测跑满原生帧率。
sensor_frame_rate = 30

# QUIC UDP 监听端口 (0=随机, 非0=固定端口便于端口映射)
# udp_port = 9090

# 是否启用音频采集 (命令行 --enable-audio 可覆盖)
# config 文件中通过 [audio] enabled 控制

# ============ 音频采集+编码 (rv1106 模式) ============
# 管线: AI(PCM采集) → [AENC(硬件编码)] → MediaPacket → libp2p stream
# encode_type="PCM" 跳过编码，直接发送原始 PCM
# 参考: rkipc [audio.0] 配置段

[audio]
# 是否启用音频采集
enabled = false
# 声卡设备名 (ALSA)
card_name = "hw:0,0"
# 采样率 (Hz): 8000 | 16000 | 24000 | 32000 | 44100 | 48000
sample_rate = 16000
# 通道数 (1=mono, 2=stereo)
channels = 1
# 每帧采样点数 (1024 @ 16kHz ≈ 64ms/frame)
frame_size = 1024
# 声卡位宽: "S16" (16-bit signed) | "U8"
format = "S16"
# 硬件音量 (0-100)
volume = 50
# 编码类型: "PCM" (不编码) | "G711A" | "G711U" | "MP2"
encode_type = "PCM"
# 编码码率 (bps): G711A = 64000@8kHz, 128000@16kHz; MP2 = 64000+
bit_rate = 128000
# VQE 语音质量增强 (依赖 vqe_cfg 配置文件)
enable_vqe = false
vqe_cfg = "/oem/usr/share/vqefiles/config_aivqe.json"

# ============ 视频源 (文件模式，非 rv1106) ============

# video_file = "test.h265"

# ============ 视频编码: 三码流配置 (rv1106 模式) ============
# 管线: VI(sensor) -> VPSS(缩放) -> VENC0(主码流) + VENC1(子码流) + VENC2(第三码流)
# 码流类型: main = 主码流(高清), sub = 子码流(标清), third = 第三码流(中清)

[video.main]
enabled = true
# 编码格式: "H265" 或 "H264"
codec = "H265"
# 分辨率 (宽 x 高)
width = 2304
height = 1296
# 帧率: fps = src_frame_rate_num / src_frame_rate_den
src_frame_rate_num = 25
src_frame_rate_den = 1
dst_frame_rate_num = 25
dst_frame_rate_den = 1
# 码率控制: "CBR" 或 "VBR"
rc_mode = "CBR"
# RC 质量等级: "highest" | "higher" | "high" | "medium" | "low" | "lower" | "lowest"
rc_quality = "high"
# 最大码率 (kbps)
bitrate_kbps = 2048
# GOP (I帧间隔，秒数×帧率)；4G 下改为 15 以加快丢帧后恢复
gop = 15
# GOP 模式: "normalP" 或 "smartP"
gop_mode = "normalP"
# SmartP 虚拟 I 帧间隔
smartp_viridrlen = 25
# H.264 Profile (仅 H264 时生效): "baseline" | "main" | "high"
h264_profile = "high"
# 码流缓冲 (帧数)
stream_buf_cnt = 2
# 画面镜像: "none" | "horizontal" | "vertical" | "both"
mirror = "none"

[video.sub]
enabled = true
codec = "H265"
width = 704
height = 576
src_frame_rate_num = 30
src_frame_rate_den = 1
dst_frame_rate_num = 30
dst_frame_rate_den = 1
rc_mode = "CBR"
rc_quality = "high"
bitrate_kbps = 512
gop = 15
gop_mode = "normalP"
smartp_viridrlen = 25
h264_profile = "high"
stream_buf_cnt = 2
mirror = "none"

[video.third]
enabled = true
codec = "H265"
width = 960
height = 540
src_frame_rate_num = 25
src_frame_rate_den = 1
dst_frame_rate_num = 25
dst_frame_rate_den = 1
rc_mode = "CBR"
rc_quality = "high"
# 第三码流(中清)原 1024kbps 在 4G(<1.5Mbps)下会饱和丢包，降到 500 留余量
bitrate_kbps = 500
gop = 15
gop_mode = "normalP"
smartp_viridrlen = 25
h264_profile = "high"
stream_buf_cnt = 2
mirror = "none"
